name: CI Build

on:
  push:
    branches:
      - '**'
    paths:
       - 'README.md'
       - '**.go'
       - 'go.mod'
       - 'go.sum'
       - '.github/workflows/*.yml'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.24' ]
    steps:
      - name: Set up Go v${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install deps
        run: |
          go version
          go mod download && go mod verify

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Vet code
        run: go vet ./...

      - name: Build
        run: go build -v .
